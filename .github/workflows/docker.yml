name: Build and publish BudTube Docker image

on:
  push:
    branches:
      - master
      - claude/cannabis-gaming-youtube-clone-48nd9t
    paths:
      - "budtube/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: budtube
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mcrashcraft/budtube:latest
            ghcr.io/mcrashcraft/budtube:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
